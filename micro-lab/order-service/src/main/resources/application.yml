server:
  # 订单服务端口（user-service 用 8081，gateway 用 9090，避免冲突）
  port: 8082

spring:
  application:
    # 服务名：注册到 Nacos 后，其他服务靠这个名字找到它
    name: order-service
  cloud:
    nacos:
      discovery:
        # Nacos 服务器地址（K8s 里的 Nacos，经 node2 的 NodePort 暴露）
        # 注意：Nacos 2.x 客户端还会连接「本端口 + 1000」的 gRPC 端口（31048），
        #       所以 Nacos 的 Service 需同时映射 30048（HTTP）与 31048（gRPC）
        # 清账日 2.0（2026-10-03）占位符化（与 gateway/backend 统一）：
        #   本地开发：走冒号后的默认值（直连虚拟机 NodePort）
        #   集群内：由 env NACOS_ADDR=nacos-svc:8848 覆盖
        server-addr: ${NACOS_ADDR:192.168.157.129:30048}
    sentinel:
      # 应用启动即完成 Sentinel 初始化（不配的话是懒加载：第一次请求才初始化）
      eager: true
      transport:
        # Sentinel 客户端与本地通信的端口
        port: 8719
        # Sentinel 控制台地址（已部署：NodePort 30058，非 30050——2026-10-01 清账日修正）
        # K8s 部署时由 Deployment env 注入覆盖（micro-lab.yaml，v5 固化）
        dashboard: 192.168.157.129:30058

# 开启 Feign 与 Sentinel 的整合：只有开启它，@FeignClient 上配置的 fallback 才会生效
feign:
  sentinel:
    enabled: true
