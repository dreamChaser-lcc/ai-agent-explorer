server:
  # 网关端口（本机 8080 已被其他进程占用，改用 9090；user=8081、order=8082 不直接对外）
  port: 9090

spring:
  application:
    name: gateway

  cloud:
    nacos:
      discovery:
        # Nacos 地址：网关靠它把"服务名"解析成实际实例地址
        # 第 4 课（2026-10-01）升级为 L2 占位符写法（与 backend 统一风格）：
        #   本地开发：走冒号后的默认值（直连虚拟机 NodePort）
        #   集群内：由 env NACOS_ADDR=nacos-svc:8848 覆盖
        server-addr: ${NACOS_ADDR:192.168.157.129:30048}

    gateway:
      # 关闭"按服务名自动路由"（默认就关）：自动路由不必写规则，
      # 路径会变成 /服务名/**，教学上先用显式路由把规则写法讲透。
      discovery:
        locator:
          enabled: false

      # ============ 路由规则：网关的核心配置 ============
      routes:
        # 路由 1：/api/users/** → 用户服务
        - id: user-service-route
          # lb = load balance：从注册中心（Nacos）按服务名找实例并负载均衡
          uri: lb://user-service
          predicates:
            # 匹配条件：请求路径以 /api/users/ 开头
            - Path=/api/users/**
          filters:
            # 转发前去掉路径的第 1 段（/api）：
            # 客户端请求 /api/users/1 → 实际转发给 user-service 的是 /users/1
            # （不加会转发 /api/users/1，而服务端只有 /users/1，导致 404）
            - StripPrefix=1

        # 路由 2：/api/orders/** → 订单服务
        - id: order-service-route
          uri: lb://order-service
          predicates:
            - Path=/api/orders/**
          filters:
            - StripPrefix=1

        # 路由 3（第 4 课，2026-10-01）：/api/tasks 与 /api/health → 真实项目 research-agent-backend
        # ★ 注意与上面两条的关键差异：这里【不加】StripPrefix
        #   - micro-lab 的 user/order 服务：接口路径不带 /api 前缀（如 /users/1）→ 必须剥掉 /api
        #   - backend：接口自带 /api 前缀（如 /api/tasks）→ 原样转发
        #   判断法：StripPrefix 取什么值，永远"看目标服务实际的路径长什么样"，而不是看网关的习惯
        - id: research-agent-route
          uri: lb://research-agent-backend
          predicates:
            - Path=/api/tasks/**,/api/health
