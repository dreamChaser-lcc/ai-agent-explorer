spring:
  datasource:
    url: jdbc:h2:file:${user.dir}/data/h2db/research-agent;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: none
    defer-datasource-initialization: true
  flyway:
    enabled: false
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-dev.sql
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false

langchain4j:
  open-ai:
    chat-model:
      api-key: ${OPENAI_API_KEY:dev-placeholder-key}
