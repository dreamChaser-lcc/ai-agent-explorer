spring:
  application:
    name: research-agent-backend

  # 配置中心接入（第 5 课，2026-10-01）：启动时从 Nacos 拉取该 dataId 并合并进配置栈
  # optional: 前缀 = Nacos 上没有这份配置也照常启动（服务不因配置中心缺席而失败）
  config:
    import:
      - optional:nacos:research-agent-backend.yaml

  cloud:
    nacos:
      discovery:
        # 注册中心（第 3 课，2026-09-28）：本地直连走虚拟机 NodePort；
        # 集群内由 env NACOS_ADDR=nacos-svc:8848 覆盖（与 micro-lab 同款模式）
        server-addr: ${NACOS_ADDR:192.168.157.129:30048}
      config:
        # 配置中心（第 5 课，2026-10-01）：与注册中心是同一个 Nacos（复用 NACOS_ADDR）
        # ★ 引导配置：连 Nacos 的地址只能放本地 yml / 由 env 注入——不能放进 Nacos（鸡生蛋）
        server-addr: ${NACOS_ADDR:192.168.157.129:30048}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/research_agent}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  kafka:
    # 场景⑥：Kafka 接入（任务消息化——异步执行从"线程池"升级为"消息队列"）
    # 开发环境：本地 docker 单节点（KRaft 模式）；集群化部署（G1）后续按需衔接
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: research-agent-backend
      # 新消费者组从【最早】消息开始读（学习环境友好：能看到历史消息——"重放"演示的前提）
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        # ★ 长任务护航：研究任务可能跑几分钟——默认 5 分钟（max.poll.interval.ms）会被误判
        #   "消费者死亡" → 触发重平衡 → 重复消费。调大到 1 小时（配合"至少一次 + 状态守卫"的容错设计）。
        max.poll.interval.ms: 3600000
  cache:
    # 场景⑦：缓存接入（报告查询提速）——type=redis：用 Redis 做缓存后端
    # 注：TTL（30 分钟）与值序列化（JSON）由 CacheConfiguration 自定义接管；
    #    兜底职责不变——@CacheEvict 可能漏，TTL 保证"最多旧 30 分钟"
    # ★ 切勿写空的 redis: 节点（只挂注释无键值）——空壳节点会让属性绑定以诡异方式失败
    type: redis
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        # 第 5 课（2026-10-01）：暴露 env 端点，用于观察配置"来源与取值"（热更新实验观测窗）
        # ★ 生产环境不建议暴露 env（可能泄漏配置明细）——学习环境临时开放
        include: health,info,env

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    root: INFO
    # 打印 JPA(Hibernate) 生成的 SQL 与参数，便于与 MyBatis 对照
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace
    # 打印 MyBatis 执行的 SQL
    com.aiexplorer.researchagent.infrastructure.persistence.store.mybatis: debug

app:
  persistence:
    # 持久化实现开关：jpa（默认）/ mybatis，可用环境变量 APP_PERSISTENCE_MODE 覆盖
    mode: ${APP_PERSISTENCE_MODE:jpa}
  execution:
    default-mode: ${APP_EXECUTION_MODE:ASYNC}
    async-thread-pool-size: ${APP_ASYNC_POOL_SIZE:4}
    pause-at-step-boundary-only: ${APP_PAUSE_AT_STEP_BOUNDARY_ONLY:true}
  llm:
    provider: ${APP_LLM_PROVIDER:openai}
    # 场景⑧：OpenAI 兼容接口地址（中转站 / 官方 DeepSeek 均可用，走 /v1/chat/completions）
    base-url: ${APP_LLM_BASE_URL:https://agentrouter.org/v1}
    # API Key 只从环境变量注入——绝不写进仓库（git 会记录明文）
    api-key: ${OPENAI_API_KEY:}
    chat-model: ${APP_LLM_CHAT_MODEL:deepseek-v4-flash}
    # ★ 中转站网关会做客户端指纹检测：默认 Java UA 会被 401 unauthorized client，
    #   必须伪装成官方客户端（场景⑧ 实测结论，改这行前先看讲义排障链）
    user-agent: ${APP_LLM_USER_AGENT:claude-cli/2.0.0 (external, cli)}
    temperature: ${APP_LLM_TEMPERATURE:0.2}
    max-steps: ${APP_LLM_MAX_STEPS:12}
    # 治理三件套参数：业务级超时 + 最大重试次数（指数退避）
    timeout-seconds: ${APP_LLM_TIMEOUT_SECONDS:20}
    max-retries: ${APP_LLM_MAX_RETRIES:2}
    # 模拟客户端开关：本地验证"超时 / 失败 / 降级"时置 true（真实下游不会配合你变慢/报错）
    simulated: ${APP_LLM_SIMULATED:false}
    simulate-mode: ${APP_LLM_SIMULATE_MODE:NORMAL}
    # 客户端实现：langchain4j（默认，框架版）| http（手写 HttpClient，代理需代码层隔离时备选）
    client-impl: ${APP_LLM_CLIENT_IMPL:langchain4j}
    # 搜索提供方：llm（默认，未接 API 时由 LLM 知识生成资料，来源标记 llm://knowledge/）| api（预留）
    search-provider: ${APP_LLM_SEARCH_PROVIDER:llm}
    # 本机代理（两种实现方式不同，别混用）：
    #   ① client-impl=http → 用下面两行（代码层代理，只作用于 LLM，实测生效）
    #   ② client-impl=langchain4j → 用 JAVA_TOOL_OPTIONS 设 JVM 代理，且必须排除内网：
    #      -Dhttps.proxyHost=127.0.0.1 -Dhttps.proxyPort=7897
    #      -Dhttp.proxyHost=127.0.0.1 -Dhttp.proxyPort=7897
    #      -Dhttp.nonProxyHosts=localhost|127.*|192.168.*
    #      ★ 不排除内网会把 Nacos(192.168.157.129) 一起代理掉，应用直接启动失败（实测踩过）
    proxy-host: ${APP_LLM_PROXY_HOST:}
    proxy-port: ${APP_LLM_PROXY_PORT:0}

langchain4j:
  open-ai:
    chat-model:
      api-key: ${OPENAI_API_KEY:}
      model-name: ${OPENAI_MODEL_NAME:gpt-4o-mini}
      log-requests: ${OPENAI_LOG_REQUESTS:false}
      log-responses: ${OPENAI_LOG_RESPONSES:false}

# ===== SP6 教学演示：配置优先级实验（可删）=====
sp6:
  demo:
    name: from-main-yml
    source: main-yml
    tags:
      - main
