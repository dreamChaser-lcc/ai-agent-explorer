# 测试环境：H2 内存库
# 场景⑫：不显式指定 ddl-auto —— 交给 @DataJpaTest 的默认行为（对嵌入库 create-drop 自动建表）。
#   历史坑：手写 schema.sql 会随实体演进（@Version 等新列）而过时，导致"编译过了、运行报列不存在"。
spring.flyway.enabled=false
spring.sql.init.mode=never
spring.datasource.url=jdbc:h2:mem:research-agent;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=