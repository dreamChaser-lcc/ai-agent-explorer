<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 720" font-family='-apple-system,"PingFang SC","Microsoft YaHei",sans-serif'>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#64748B"/>
    </marker>
    <marker id="aR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#DC2626"/>
    </marker>
    <marker id="aB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#2563EB"/>
    </marker>
  </defs>

  <rect width="980" height="720" fill="#FFFFFF"/>
  <text x="490" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#0F172A">Redis 核心概念地图（20 个概念一图看懂）</text>
  <text x="490" y="54" text-anchor="middle" font-size="12" fill="#64748B">Key-Value · 5+3 类型 · 过期淘汰 · RDB/AOF · 单线程epoll · 主从/哨兵/集群 · Pipeline · Lua · 缓存三件套 · 分布式锁 · BigKey</text>

  <!-- Client -->
  <rect x="30" y="80" width="180" height="86" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="120" y="104" text-anchor="middle" font-size="13" font-weight="700" fill="#1D4ED8">Client（应用/Spring）</text>
  <text x="42" y="124" font-size="10" fill="#1E40AF">Spring Data Redis / Lettuce</text>
  <text x="42" y="140" font-size="10" fill="#1E40AF">StringRedisTemplate（08 课）</text>
  <text x="42" y="156" font-size="10" fill="#1E40AF">Pipeline / Lua（16/17 条）</text>
  <line x1="210" y1="123" x2="246" y2="123" stroke="#64748B" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Redis 核心 -->
  <rect x="250" y="70" width="420" height="330" rx="12" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.8"/>
  <text x="460" y="94" text-anchor="middle" font-size="14" font-weight="700" fill="#B91C1C">Redis Server（单线程事件循环 + epoll）</text>
  <text x="460" y="111" text-anchor="middle" font-size="10" fill="#F87171">命令串行执行 → 天然原子（但慢命令会阻塞所有人）</text>

  <!-- 数据类型 -->
  <rect x="265" y="122" width="390" height="96" rx="8" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.2"/>
  <text x="275" y="140" font-size="11.5" font-weight="700" fill="#C2410C">Value 类型（5 基础 + 3 扩展）</text>
  <text x="275" y="158" font-size="10" fill="#7C2D12">String(SDS) │ Hash │ List │ Set │ ZSet(跳表)</text>
  <text x="275" y="175" font-size="10" fill="#7C2D12">Bitmap（位图）│ HyperLogLog（基数）│ GEO（地理）</text>
  <text x="275" y="193" font-size="10" fill="#7C2D12">Key 全局命名空间（大 key / 热 key 是两大风险）</text>
  <text x="275" y="210" font-size="10" fill="#7C2D12">项目：T5 RedisConstant 统一 key 命名</text>

  <!-- 过期 + 淘汰 -->
  <rect x="265" y="224" width="190" height="76" rx="8" fill="#F0F9FF" stroke="#0284C7" stroke-width="1.2"/>
  <text x="275" y="242" font-size="11" font-weight="700" fill="#0369A1">过期删除（TTL）</text>
  <text x="275" y="258" font-size="9.8" fill="#075985">惰性删除（访问时才查）</text>
  <text x="275" y="274" font-size="9.8" fill="#075985">定期删除（每秒抽样扫）</text>
  <text x="275" y="290" font-size="9.8" fill="#075985">→ 过期 key 不保证立刻消失</text>

  <rect x="465" y="224" width="190" height="76" rx="8" fill="#F0F9FF" stroke="#0284C7" stroke-width="1.2"/>
  <text x="475" y="242" font-size="11" font-weight="700" fill="#0369A1">内存淘汰（8 策略）</text>
  <text x="475" y="258" font-size="9.8" fill="#075985">noeviction / allkeys-lru</text>
  <text x="475" y="274" font-size="9.8" fill="#075985">volatile-lru / allkeys-random ...</text>
  <text x="475" y="290" font-size="9.8" fill="#075985">→ 内存满时按策略删 key</text>

  <!-- 持久化 -->
  <rect x="265" y="308" width="390" height="76" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.2"/>
  <text x="275" y="326" font-size="11.5" font-weight="700" fill="#6D28D9">持久化（RDB + AOF）</text>
  <text x="275" y="344" font-size="10" fill="#5B21B6">RDB：定时快照（fork 子进程，二进制，恢复快）</text>
  <text x="275" y="360" font-size="10" fill="#5B21B6">AOF：追加命令日志（fsync 三档：always/everysec/no）</text>
  <text x="275" y="376" font-size="10" fill="#5B21B6">混合持久化（RDB 头 + AOF 尾）→ 生产推荐</text>

  <!-- 高可用 -->
  <rect x="690" y="70" width="270" height="200" rx="12" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.6"/>
  <text x="825" y="94" text-anchor="middle" font-size="13.5" font-weight="700" fill="#15803D">高可用三形态</text>

  <rect x="705" y="106" width="240" height="46" rx="6" fill="#DCFCE7" stroke="#16A34A" stroke-width="1"/>
  <text x="715" y="123" font-size="10.5" font-weight="600" fill="#14532D">① 主从复制（Replication）</text>
  <text x="715" y="140" font-size="9.6" fill="#166534">replicaof + psync + repl_backlog</text>

  <rect x="705" y="158" width="240" height="46" rx="6" fill="#DCFCE7" stroke="#16A34A" stroke-width="1"/>
  <text x="715" y="175" font-size="10.5" font-weight="600" fill="#14532D">② Sentinel（哨兵）</text>
  <text x="715" y="192" font-size="9.6" fill="#166534">主观/客观下线 + 自动选主切换</text>

  <rect x="705" y="210" width="240" height="46" rx="6" fill="#DCFCE7" stroke="#16A34A" stroke-width="1"/>
  <text x="715" y="227" font-size="10.5" font-weight="600" fill="#14532D">③ Cluster（集群分片）</text>
  <text x="715" y="244" font-size="9.6" fill="#166534">16384 slot + MOVED/ASK 重定向</text>

  <!-- 连接 Redis -> 高可用 -->
  <line x1="670" y1="170" x2="704" y2="170" stroke="#64748B" stroke-width="1.4" marker-end="url(#a)"/>

  <!-- 应用模式 -->
  <rect x="30" y="424" width="290" height="130" rx="10" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="175" y="448" text-anchor="middle" font-size="12.5" font-weight="700" fill="#B45309">缓存三件套（04 课）</text>
  <text x="42" y="468" font-size="10.3" fill="#92400E">穿透 → 布隆过滤器 / 空值缓存</text>
  <text x="42" y="486" font-size="10.3" fill="#92400E">击穿 → 互斥锁 / 逻辑过期</text>
  <text x="42" y="504" font-size="10.3" fill="#92400E">雪崩 → 随机 TTL / 多级缓存 / 熔断</text>
  <text x="42" y="524" font-size="9.8" fill="#B45309">项目：场景⑦ @Cacheable + TTL 30min</text>
  <text x="42" y="542" font-size="9.8" fill="#B45309">+ JSON 序列化（不用 JDK 序列化）</text>

  <rect x="340" y="424" width="300" height="130" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="490" y="448" text-anchor="middle" font-size="12.5" font-weight="700" fill="#B91C1C">分布式锁（05/09 课）</text>
  <text x="352" y="468" font-size="10.3" fill="#7F1D1D">SET key value NX EX 30（原子抢锁+过期）</text>
  <text x="352" y="486" font-size="10.3" fill="#7F1D1D">解锁必须 Lua 比对 token（防误删）</text>
  <text x="352" y="504" font-size="10.3" fill="#7F1D1D">Redisson 看门狗（自动续期）</text>
  <text x="352" y="524" font-size="9.8" fill="#B91C1C">项目：场景⑨ DistributedTaskLock</text>
  <text x="352" y="542" font-size="9.8" fill="#B91C1C">（SET NX EX + Lua 语义命令封装）</text>

  <rect x="660" y="424" width="290" height="130" rx="10" fill="#F0F9FF" stroke="#0EA5E9" stroke-width="1.5"/>
  <text x="805" y="448" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0369A1">原子与批量</text>
  <text x="672" y="468" font-size="10.3" fill="#075985">Pipeline：批量发送减 RTT（不保证原子）</text>
  <text x="672" y="486" font-size="10.3" fill="#075985">Lua 脚本：服务端原子执行（替代事务）</text>
  <text x="672" y="504" font-size="10.3" fill="#075985">MULTI/EXEC：事务（弱原子，不推荐）</text>
  <text x="672" y="524" font-size="9.8" fill="#0369A1">项目：验证码限流 = INCR + EXPIRE 原子化</text>
  <text x="672" y="542" font-size="9.8" fill="#0369A1">（09 课：Lua 保证"判断+扣减"原子）</text>

  <!-- 风险条 -->
  <rect x="30" y="574" width="920" height="56" rx="8" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.3"/>
  <text x="45" y="594" font-size="11.5" font-weight="700" fill="#B91C1C">两大风险（必须提前防）</text>
  <text x="45" y="612" font-size="10.3" fill="#7F1D1D">
    BigKey（单个 value 过大 → 阻塞网络/内存不均/删除卡顿）：拆 key / 压缩 / 异步删除 UNLINK
  </text>
  <text x="45" y="626" font-size="10.3" fill="#7F1D1D">
    热 Key（单个 key 被高并发访问 → 打满单分片）：本地缓存 / 读写分离 / key 散列（加随机后缀）
  </text>

  <text x="490" y="664" text-anchor="middle" font-size="10.5" fill="#64748B">Redis 的本质：一个单线程的"数据结构服务器"——所有高级能力（缓存/锁/限流/排行榜）都是 5+3 种类型的组合用法</text>
  <text x="490" y="684" text-anchor="middle" font-size="10" fill="#94A3B8">配套讲义：Redis实战/01–11 课（本图是概念索引，详细讲解见各课 + 附录总览）</text>
</svg>
