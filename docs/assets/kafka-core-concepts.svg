<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 700" font-family='-apple-system,"PingFang SC","Microsoft YaHei",sans-serif'>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#64748B"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#16A34A"/>
    </marker>
    <marker id="arrP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#7C3AED"/>
    </marker>
  </defs>

  <rect width="980" height="700" fill="#FFFFFF"/>
  <text x="490" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#0F172A">Kafka 核心概念地图（16 个概念一图看懂）</text>
  <text x="490" y="56" text-anchor="middle" font-size="12" fill="#64748B">Event · Topic · Partition · Offset · Broker · Producer · Consumer · ConsumerGroup · Rebalance · Replication · ISR · Exactly-once · Retention · LogCompaction · KRaft · HW/LEO</text>

  <!-- Producer -->
  <rect x="30" y="90" width="190" height="120" rx="10" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.6"/>
  <text x="125" y="114" text-anchor="middle" font-size="13" font-weight="700" fill="#C2410C">Producer（生产者）</text>
  <text x="45" y="136" font-size="10.5" fill="#7C2D12">· send(topic, key, value)</text>
  <text x="45" y="154" font-size="10.5" fill="#7C2D12">· 决定分区：hash(key) % N</text>
  <text x="45" y="172" font-size="10.5" fill="#7C2D12">· acks=0/1/all（可靠性）</text>
  <text x="45" y="190" font-size="10.5" fill="#7C2D12">· 幂等生产者：PID+序列号</text>

  <!-- 分区器 -->
  <rect x="250" y="118" width="130" height="64" rx="8" fill="#F1F5F9" stroke="#475569" stroke-width="1.4"/>
  <text x="315" y="141" text-anchor="middle" font-size="11.5" font-weight="600" fill="#334155">分区器</text>
  <text x="315" y="159" text-anchor="middle" font-size="10" fill="#64748B">同 key → 同分区</text>
  <text x="315" y="173" text-anchor="middle" font-size="10" fill="#64748B">（顺序保障的起点）</text>
  <line x1="220" y1="150" x2="246" y2="150" stroke="#64748B" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="380" y1="150" x2="410" y2="150" stroke="#64748B" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Broker 集群 -->
  <rect x="415" y="90" width="400" height="290" rx="12" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.8"/>
  <text x="615" y="114" text-anchor="middle" font-size="14" font-weight="700" fill="#15803D">Broker（Kafka 服务器集群 · KRaft 模式）</text>
  <text x="615" y="131" text-anchor="middle" font-size="10" fill="#4ADE80">KRaft = 用 Raft 自管理元数据，已不需要 ZooKeeper</text>

  <!-- Topic + 3 Partitions -->
  <text x="432" y="156" font-size="11.5" font-weight="700" fill="#166534">Topic: research-task-execution（逻辑分类）</text>

  <rect x="430" y="166" width="370" height="22" rx="4" fill="#DCFCE7" stroke="#16A34A" stroke-width="1"/>
  <text x="440" y="182" font-size="10" fill="#14532D" font-weight="600">Partition 0</text>
  <text x="530" y="182" font-size="10" fill="#166534">[0] [1] [2] [3] [4] [5] ── 只追加日志（segment 分段）</text>

  <rect x="430" y="192" width="370" height="22" rx="4" fill="#DCFCE7" stroke="#16A34A" stroke-width="1"/>
  <text x="440" y="208" font-size="10" fill="#14532D" font-weight="600">Partition 1</text>
  <text x="530" y="208" font-size="10" fill="#166534">[0] [1] [2] ── 分区内有序，并发单位</text>

  <rect x="430" y="218" width="370" height="22" rx="4" fill="#DCFCE7" stroke="#16A34A" stroke-width="1"/>
  <text x="440" y="234" font-size="10" fill="#14532D" font-weight="600">Partition 2</text>
  <text x="530" y="234" font-size="10" fill="#166534">[0] [1] [2] [3] ── offset 单调递增</text>

  <!-- 副本/ISR/HW -->
  <rect x="430" y="250" width="180" height="58" rx="6" fill="#ECFDF5" stroke="#10B981" stroke-width="1.2"/>
  <text x="440" y="268" font-size="10.5" font-weight="700" fill="#047857">Replication（副本）3 副本</text>
  <text x="440" y="284" font-size="9.8" fill="#065F46">Leader + 2 Follower 同步复制</text>
  <text x="440" y="299" font-size="9.8" fill="#065F46">broker 挂 → follower 顶上</text>

  <rect x="620" y="250" width="180" height="58" rx="6" fill="#ECFDF5" stroke="#10B981" stroke-width="1.2"/>
  <text x="630" y="268" font-size="10.5" font-weight="700" fill="#047857">ISR（同步副本集合）</text>
  <text x="630" y="284" font-size="9.8" fill="#065F46">acks=all 等 ISR 全部落盘</text>
  <text x="630" y="299" font-size="9.8" fill="#065F46">落后超时 → 移出 ISR</text>

  <rect x="430" y="316" width="180" height="52" rx="6" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.1"/>
  <text x="440" y="334" font-size="10.5" font-weight="700" fill="#475569">HW / LEO</text>
  <text x="440" y="349" font-size="9.6" fill="#64748B">LEO=副本末尾；HW=ISR 都到哪</text>
  <text x="440" y="362" font-size="9.6" fill="#64748B">消费者只能读到 HW 之前</text>

  <rect x="620" y="316" width="180" height="52" rx="6" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.1"/>
  <text x="630" y="334" font-size="10.5" font-weight="700" fill="#475569">Retention（保留）</text>
  <text x="630" y="349" font-size="9.6" fill="#64748B">默认 7 天，到期删 segment</text>
  <text x="630" y="362" font-size="9.6" fill="#64748B">消费≠删除 → 可重放</text>

  <!-- 底部概念条 -->
  <rect x="30" y="400" width="300" height="52" rx="8" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.3"/>
  <text x="180" y="419" text-anchor="middle" font-size="11" font-weight="700" fill="#B45309">Event（事件）</text>
  <text x="180" y="437" text-anchor="middle" font-size="9.8" fill="#92400E">消息的哲学叫法：一条"事实发生了"的不可变记录</text>

  <rect x="345" y="400" width="300" height="52" rx="8" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.3"/>
  <text x="495" y="419" text-anchor="middle" font-size="11" font-weight="700" fill="#B45309">Offset（偏移量/书签）</text>
  <text x="495" y="437" text-anchor="middle" font-size="9.8" fill="#92400E">消息在分区内的唯一编号；提交的是"下一个要读的位置"</text>

  <rect x="660" y="400" width="290" height="52" rx="8" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.3"/>
  <text x="805" y="419" text-anchor="middle" font-size="11" font-weight="700" fill="#B45309">Log Compaction（日志压缩）</text>
  <text x="805" y="437" text-anchor="middle" font-size="9.8" fill="#92400E">按 key 只留最新值（状态快照类主题）</text>

  <!-- Consumer -->
  <rect x="30" y="480" width="440" height="180" rx="12" fill="#FAF5FF" stroke="#7C3AED" stroke-width="1.8"/>
  <text x="250" y="504" text-anchor="middle" font-size="13.5" font-weight="700" fill="#6D28D9">Consumer Group A（消费组：组内分摊）</text>
  <text x="45" y="524" font-size="10.5" fill="#5B21B6">pull 循环：poll 一批 → 逐条处理 → commit offset → poll 下一批</text>

  <rect x="45" y="534" width="200" height="40" rx="6" fill="#EDE9FE" stroke="#8B5CF6" stroke-width="1.2"/>
  <text x="55" y="551" font-size="10.5" font-weight="600" fill="#5B21B6">Consumer A</text>
  <text x="55" y="566" font-size="9.8" fill="#6D28D9">吃 Partition 0</text>

  <rect x="255" y="534" width="200" height="40" rx="6" fill="#EDE9FE" stroke="#8B5CF6" stroke-width="1.2"/>
  <text x="265" y="551" font-size="10.5" font-weight="600" fill="#5B21B6">Consumer B</text>
  <text x="265" y="566" font-size="9.8" fill="#6D28D9">吃 Partition 1 + 2</text>

  <rect x="45" y="584" width="410" height="30" rx="6" fill="#F5F3FF" stroke="#A78BFA" stroke-width="1"/>
  <text x="250" y="603" text-anchor="middle" font-size="9.8" fill="#5B21B6">消费位置持久化在内置主题 __consumer_offsets（重启后从这里恢复）</text>

  <rect x="45" y="622" width="410" height="28" rx="6" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.1"/>
  <text x="250" y="640" text-anchor="middle" font-size="9.8" fill="#B91C1C">Rebalance：消费者增减/超时 → 分区重新分配（整组 STW，期间暂停消费）</text>

  <!-- 箭头：Broker -> Consumer -->
  <line x1="615" y1="380" x2="350" y2="480" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arrP)"/>
  <text x="500" y="430" font-size="10" fill="#7C3AED">poll 拉取</text>

  <!-- Consumer Group B -->
  <rect x="490" y="480" width="460" height="180" rx="12" fill="#F8FAFC" stroke="#64748B" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="720" y="504" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">Consumer Group B（另一个组：组间广播）</text>
  <text x="505" y="524" font-size="10.3" fill="#475569">同一 Topic 的另一个消费组 —— 各读各的 offset，独立消费【全量】</text>
  <text x="505" y="542" font-size="10.3" fill="#475569">→ 加"审计消费者"只需换 group-id 订阅同一 topic（生产者零改动）</text>

  <rect x="505" y="552" width="200" height="38" rx="6" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.1"/>
  <text x="515" y="568" font-size="10.3" font-weight="600" fill="#334155">Consumer C（组 B）</text>
  <text x="515" y="582" font-size="9.6" fill="#64748B">吃全部 3 个分区</text>

  <rect x="505" y="598" width="430" height="50" rx="6" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.1"/>
  <text x="515" y="615" font-size="10.3" font-weight="700" fill="#15803D">Exactly-once（精确一次）</text>
  <text x="515" y="631" font-size="9.6" fill="#166534">Kafka 内部：幂等生产者（去重）+ 事务（跨分区原子）+ read_committed</text>
  <text x="515" y="645" font-size="9.6" fill="#166534">跨系统（DB+MQ）：做不到 → 用 outbox（M6）</text>
</svg>
